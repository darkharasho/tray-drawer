name: Release

# Push a tag like v1.0.1 (matching "Version" in package/metadata.json) to publish
# tray-drawer-<version>.plasmoid as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches metadata.json
        id: version
        run: |
          version=$(jq -r .KPlugin.Version package/metadata.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match metadata.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build .plasmoid
        run: |
          out="tray-drawer-${{ steps.version.outputs.version }}.plasmoid"
          (cd package && zip -r -X "../$out" .)
          unzip -l "$out"
          echo "PLASMOID=$out" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$PLASMOID" --title "Tray Drawer $GITHUB_REF_NAME" --generate-notes
